basePath: /api
definitions:
  handlers.CreateProjectRequest:
    properties:
      color:
        type: string
      description:
        type: string
      name:
        type: string
      parent_project_id:
        type: integer
    required:
    - color
    - name
    type: object
  handlers.CreateTodoRequest:
    properties:
      description:
        type: string
      duration_minutes:
        type: integer
      parent_todo_id:
        type: integer
      project_id:
        type: integer
      scheduled_date:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.GetUserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      profile_picture_url:
        type: string
      token_expires_at:
        description: Unix timestamp in seconds
        type: integer
    type: object
  handlers.HealthStatus:
    properties:
      dependencies:
        additionalProperties:
          type: string
        type: object
      environment:
        type: string
      go_version:
        type: string
      memory:
        $ref: '#/definitions/handlers.MemStats'
      status:
        type: string
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  handlers.ImageToTextResponse:
    properties:
      text:
        type: string
    type: object
  handlers.MemStats:
    properties:
      alloc:
        description: Bytes allocated and not yet freed
        type: integer
      num_gc:
        description: Number of completed GC cycles
        type: integer
      sys:
        description: Bytes obtained from system
        type: integer
      total_alloc:
        description: Bytes allocated (even if freed)
        type: integer
    type: object
  handlers.MessageResponse:
    properties:
      message:
        type: string
    type: object
  handlers.ProjectResponse:
    properties:
      color:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_project_id:
        type: integer
    type: object
  handlers.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.SendNotificationRequest:
    properties:
      badge:
        type: string
      body:
        type: string
      data: {}
      icon:
        type: string
      title:
        type: string
      user_ids:
        description: If empty, send to current user
        items:
          type: integer
        type: array
    required:
    - body
    - title
    type: object
  handlers.SubscribeRequest:
    properties:
      endpoint:
        type: string
      keys:
        properties:
          auth:
            type: string
          p256dh:
            type: string
        required:
        - auth
        - p256dh
        type: object
    required:
    - endpoint
    - keys
    type: object
  handlers.TodoResponse:
    properties:
      completed:
        type: boolean
      description:
        type: string
      duration_minutes:
        type: integer
      id:
        type: integer
      parent_todo_id:
        type: integer
      project_id:
        type: integer
      scheduled_date:
        type: string
      title:
        type: string
    type: object
  handlers.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handlers.UpdateProjectRequest:
    properties:
      color:
        type: string
      description:
        type: string
      name:
        type: string
      parent_project_id:
        type: integer
    required:
    - color
    - name
    type: object
  handlers.UpdateTodoRequest:
    properties:
      completed:
        type: boolean
      description:
        type: string
      duration_minutes:
        type: integer
      parent_todo_id:
        type: integer
      project_id:
        type: integer
      scheduled_date:
        type: string
      title:
        type: string
    required:
    - title
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A todo and project management API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ODOT API
  version: "1.0"
paths:
  /auth/google/callback:
    get:
      description: Handles the callback from Google authentication.
      responses:
        "307":
          description: Temporary Redirect
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Google callback
      tags:
      - auth
  /auth/google/login:
    get:
      description: Redirects to Google for authentication.
      responses:
        "307":
          description: Temporary Redirect
      summary: Login with Google
      tags:
      - auth
  /auth/logout:
    post:
      description: Logs the user out by revoking the refresh token and clearing cookies.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Provides a new access token and refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: refresh_token
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh authentication token
      tags:
      - auth
  /auth/revoke-all:
    post:
      description: Revokes all of the user's refresh tokens.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Revoke all tokens
      tags:
      - auth
  /health:
    get:
      description: Check the health of the application and its dependencies
      parameters:
      - description: Return a simplified health status
        in: query
        name: simple
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Simple status when simple=true and healthy
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Simple status when simple=true and unhealthy
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get application health status
      tags:
      - health
  /image/text:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image and extract text using OCR
      parameters:
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ImageToTextResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Extract text from image
      tags:
      - image
  /me:
    get:
      description: Retrieves information for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user information
      tags:
      - users
  /projects:
    get:
      description: Retrieves all projects for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ProjectResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Creates a new project for the authenticated user.
      parameters:
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new project
      tags:
      - projects
  /projects/{id}:
    put:
      consumes:
      - application/json
      description: Updates an existing project for the authenticated user.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /push/send:
    post:
      consumes:
      - application/json
      description: Send a push notification to specified users or current user
      parameters:
      - description: Notification details
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/handlers.SendNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send push notification
      tags:
      - push
  /push/subscribe:
    post:
      consumes:
      - application/json
      description: Subscribe the current user to push notifications
      parameters:
      - description: Push subscription details
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/handlers.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Subscribe to push notifications
      tags:
      - push
  /push/vapid-public-key:
    get:
      description: Get the VAPID public key needed for push subscription
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get VAPID public key
      tags:
      - push
  /todos:
    get:
      description: Retrieves all todos for the authenticated user, optionally filtered
        by project and completion status.
      parameters:
      - description: Filter by project ID
        in: query
        name: project_id
        type: integer
      - description: Filter by completion status (true for completed, false for incomplete)
        in: query
        name: completed
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TodoResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user todos
      tags:
      - todos
    post:
      consumes:
      - application/json
      description: Creates a new todo for the authenticated user.
      parameters:
      - description: Todo details
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTodoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TodoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new todo
      tags:
      - todos
  /todos/{todoId}:
    get:
      description: Retrieves a specific todo by ID for the authenticated user.
      parameters:
      - description: Todo ID
        in: path
        name: todoId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TodoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a specific todo
      tags:
      - todos
    put:
      consumes:
      - application/json
      description: Updates a specific todo for the authenticated user.
      parameters:
      - description: Todo ID
        in: path
        name: todoId
        required: true
        type: integer
      - description: Updated todo details
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateTodoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a todo
      tags:
      - todos
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
